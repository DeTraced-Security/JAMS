name: CMake CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:  
        - os: ubuntu-24.04
          build_type: Debug
          cc: gcc
          cxx: g++
  
        - os: ubuntu-24.04
          build_type: Release
          cc: gcc
          cxx: g++
  
        - os: ubuntu-24.04
          build_type: Debug
          cc: clang
          cxx: clang++
  
        - os: ubuntu-24.04
          build_type: Release
          cc: clang
          cxx: clang++
    steps:        
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          liburing-dev \
          libssl-dev \
          cmake \
          ninja-build

    - name: Install clang
      if: matrix.cc == 'clang'
      run: sudo apt-get install -y clang

    - name: Set build directory
      id: strings
      run: echo "build-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-dir }}
        -G Ninja
        -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
        -DCMAKE_C_COMPILER=${{ matrix.cc }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-dir }}
      
